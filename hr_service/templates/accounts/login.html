<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — HR-Сервис</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      width: 100%; max-width: 420px;
      border-radius: 1rem; overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,.25);
    }
    .login-header {
      background: #3b82f6; color: #fff;
      padding: 2rem; text-align: center;
    }
    .login-footer {
      padding: 0 1.5rem 1.25rem;
      text-align: center;
    }
    .login-footer a {
      font-size: .72rem;
      color: #94a3b8;
      text-decoration: none;
    }
    .login-footer a:hover { color: #64748b; text-decoration: underline; }
    .cookie-consent {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: .85rem 1.25rem;
      z-index: 1050;
      box-shadow: 0 -4px 24px rgba(15, 23, 42, .08);
    }
    .cookie-consent[hidden] { display: none !important; }
    .cookie-consent-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem 1rem;
    }
    .cookie-consent-text {
      font-size: .85rem;
      color: #475569;
      flex: 1 1 200px;
    }
    .cookie-consent-text a { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="login-card bg-white">
    <div class="login-header">
      <i class="bi bi-people-fill fs-1 mb-2 d-block"></i>
      <h4 class="mb-0">HR-Сервис</h4>
      <small class="opacity-75">Войдите в систему</small>
    </div>
    <div class="p-4">
      {% if form.errors %}
        <div class="alert alert-danger py-2 small">
          Неверное имя пользователя или пароль.
        </div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">{{ form.username.label }}</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">{{ form.password.label }}</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i> Войти
        </button>
      </form>
    </div>
    <div class="login-footer">
      <a href="{% url 'accounts:privacy_policy' %}">Политика обработки персональных данных</a>
    </div>
  </div>
  {% include "includes/cookie_consent.html" %}
  <script>
  (function () {
    var KEY = "hr_cookie_consent";
    var banner = document.getElementById("cookie-consent");
    var acceptBtn = document.getElementById("cookie-accept");
    if (!banner || !acceptBtn) return;
    if (localStorage.getItem(KEY)) return;
    banner.hidden = false;
    acceptBtn.addEventListener("click", function () {
      localStorage.setItem(KEY, "accepted");
      banner.hidden = true;
    });
  })();
  </script>
</body>
</html>
